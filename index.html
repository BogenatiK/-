<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Поймай луч: Земля → Марс</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game-canvas"></canvas>

    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">Заряд</span>
        <div class="battery">
          <div id="battery-fill" class="battery-fill"></div>
        </div>
        <span id="battery-value" class="hud-value">100%</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">До Марса</span>
        <span id="progress-value" class="hud-value">100%</span>
      </div>
      <!-- Новый индикатор выбранного паруса -->
      <div class="hud-item">
        <span class="hud-label">Парус</span>
        <span id="hud-sail-name" class="hud-value" style="font-size: 13px;">Стандарт</span>
      </div>
    </div>

    <div id="progress-bar">
      <div id="progress-fill"></div>
      <span class="progress-label progress-label-start">Земля</span>
      <span class="progress-label progress-label-end">Марс</span>
    </div>

    <!-- ЭКРАН 1: Выбор сложности -->
    <div id="menu-screen" class="overlay">
      <h1 class="title">Земля → Марс</h1>
      <p class="subtitle">
        Управляй солнечным парусом, лови лучи для подзарядки
        и уклоняйся от астероидов.
      </p>
      <div class="difficulty-buttons">
        <button class="btn difficulty-btn" data-difficulty="easy">Лёгкий</button>
        <button class="btn difficulty-btn" data-difficulty="medium">Средний</button>
        <button class="btn difficulty-btn" data-difficulty="hard">Сложный</button>
      </div>
      <p class="hint">Управление: движение мыши или пальца влево-вправо</p>
    </div>

    <!-- ЭКРАН 2: Выбор паруса (НОВЫЙ) -->
    <div id="ship-screen" class="overlay hidden">
      <h1 class="title">Выбор паруса</h1>
      <p class="subtitle">От размера паруса зависят маневренность, скорость полета и расход энергии.</p>
      
      <div class="ships-grid">
        <button class="btn ship-btn" data-ship="small">
          <span class="ship-name">Малый</span>
          <span class="ship-desc">Максимальная маневренность<br>Низкий расход энергии<br>Долгий полет</span>
        </button>
        
        <button class="btn ship-btn active" data-ship="medium">
          <span class="ship-name">Стандарт</span>
          <span class="ship-desc">Сбалансированные характеристики<br>Средний расход энергии<br>Средний полет</span>
        </button>
        
        <button class="btn ship-btn" data-ship="large">
          <span class="ship-name">Крупный</span>
          <span class="ship-desc">Низкая маневренность<br>Высокий расход энергии<br>Быстрый полет</span>
        </button>
      </div>

      <button id="start-game-btn" class="btn" style="margin-top: 30px; background: linear-gradient(180deg, #4CAF50, #2E7D32); border-color: #81C784;">Начать полет</button>
      <button id="back-to-diff-btn" class="btn btn-secondary">Назад к сложности</button>
    </div>

    <div id="result-screen" class="overlay hidden">
      <h1 id="result-title" class="title">Результат</h1>
      <p id="result-text" class="subtitle"></p>
      <button id="restart-btn" class="btn">Заново</button>
      <button id="menu-btn" class="btn btn-secondary">Выбрать сложность</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
